org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.parallel=true

kotlin.code.style=official

# Single source of truth for the published version: Gradle applies a `version` property to every
# project, so a release bump is one edit here rather than seven that can drift apart. The release
# workflow verifies the tag against every publishing module, which also catches a module that
# reintroduces its own `version = ...`.
version=0.1.0-SNAPSHOT

android.useAndroidX=true

org.jetbrains.dokka.experimental.gradle.pluginMode=V2Enabled
org.jetbrains.dokka.experimental.gradle.pluginMode.noWarn=true
