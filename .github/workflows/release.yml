name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  publish:
    name: Publish to Maven Central
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Verify tag matches module versions
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          case "$TAG_VERSION" in
            *-SNAPSHOT) echo "Refusing to release a -SNAPSHOT version ($TAG_VERSION)"; exit 1 ;;
          esac
          MODULES=$(./gradlew -q publishingModules)
          if [ -z "$MODULES" ]; then
            echo "Found no modules configured for publication - the version gate would pass"
            echo "without checking anything. Refusing to release."
            exit 1
          fi
          echo "Verifying $(echo "$MODULES" | wc -l) publishing module(s) against tag v$TAG_VERSION:"
          for module in $MODULES; do
            MODULE_VERSION=$(./gradlew -q "$module:properties" | awk '/^version: /{print $2}')
            if [ "$MODULE_VERSION" != "$TAG_VERSION" ]; then
              echo "Tag v$TAG_VERSION does not match $module version $MODULE_VERSION."
              echo "Bump 'version' in gradle.properties and date the CHANGELOG before tagging."
              exit 1
            fi
            echo "  $module $MODULE_VERSION"
          done
          echo "Releasing version $TAG_VERSION"

      - name: Build
        run: ./gradlew build --stacktrace

      - name: Publish
        run: ./gradlew publishAndReleaseToMavenCentral --no-configuration-cache --stacktrace
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
