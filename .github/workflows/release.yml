name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  publish:
    name: Publish to Maven Central
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Only this job needs write access, and only for creating the GitHub Release; anything added
    # later starts from the read-only default above.
    permissions:
      contents: write
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Verify tag matches module versions
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          case "$TAG_VERSION" in
            *-SNAPSHOT) echo "Refusing to release a -SNAPSHOT version ($TAG_VERSION)"; exit 1 ;;
          esac
          MODULES=$(./gradlew -q publishingModules)
          if [ -z "$MODULES" ]; then
            echo "Found no modules configured for publication - the version gate would pass"
            echo "without checking anything. Refusing to release."
            exit 1
          fi
          echo "Verifying $(echo "$MODULES" | wc -l) publishing module(s) against tag v$TAG_VERSION:"
          for module in $MODULES; do
            MODULE_VERSION=$(./gradlew -q "$module:properties" | awk '/^version: /{print $2}')
            if [ "$MODULE_VERSION" != "$TAG_VERSION" ]; then
              echo "Tag v$TAG_VERSION does not match $module version $MODULE_VERSION."
              echo "Bump 'version' in gradle.properties and date the CHANGELOG before tagging."
              exit 1
            fi
            echo "  $module $MODULE_VERSION"
          done
          echo "Releasing version $TAG_VERSION"

      # Extract before publishing, not alongside the release step at the end: a Maven Central
      # publication cannot be undone, so a missing or misnamed CHANGELOG section has to fail while
      # failing is still free.
      - name: Extract release notes from the CHANGELOG
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          awk -v ver="$TAG_VERSION" '
            $0 ~ "^## \\[" ver "\\]" { found = 1; next }
            found && (/^## / || /^\[[^]]+\]: /) { exit }
            found { print }
          ' CHANGELOG.md | sed '/./,$!d' > "$RUNNER_TEMP/release-notes.md"
          if [ ! -s "$RUNNER_TEMP/release-notes.md" ]; then
            echo "CHANGELOG.md has no '## [$TAG_VERSION]' section, so the release would be"
            echo "announced with empty notes. Add the section (or collapse [Unreleased] into it)"
            echo "before tagging."
            exit 1
          fi
          echo "Release notes ($(wc -l < "$RUNNER_TEMP/release-notes.md") lines):"
          cat "$RUNNER_TEMP/release-notes.md"

      - name: Build
        run: ./gradlew build --stacktrace

      - name: Publish
        run: ./gradlew publishAndReleaseToMavenCentral --no-configuration-cache --stacktrace
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}

      # Last, so a failed publication never announces a release that has no artifacts behind it.
      # `gh` ships on the runner, so this adds no third-party action to the release path.
      - name: Cut a GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          # A version with a pre-release suffix (1.0.0-rc1) is marked as such; -SNAPSHOT was
          # already refused by the version gate.
          case "$TAG_VERSION" in
            *-*) PRERELEASE=--prerelease ;;
            *)   PRERELEASE= ;;
          esac
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            --verify-tag \
            $PRERELEASE
