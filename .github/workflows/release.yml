name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  publish:
    name: Publish to Maven Central
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          # Nothing here pushes to the repository, so the job's token has no business sitting in
          # .git/config where every later build and publish command inherits it.
          persist-credentials: false

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Verify tag matches module versions
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          case "$TAG_VERSION" in
            *-SNAPSHOT) echo "Refusing to release a -SNAPSHOT version ($TAG_VERSION)"; exit 1 ;;
          esac
          MODULES=$(./gradlew -q publishingModules)
          if [ -z "$MODULES" ]; then
            echo "Found no modules configured for publication - the version gate would pass"
            echo "without checking anything. Refusing to release."
            exit 1
          fi
          echo "Verifying $(echo "$MODULES" | wc -l) publishing module(s) against tag v$TAG_VERSION:"
          for module in $MODULES; do
            MODULE_VERSION=$(./gradlew -q "$module:properties" | awk '/^version: /{print $2}')
            if [ "$MODULE_VERSION" != "$TAG_VERSION" ]; then
              echo "Tag v$TAG_VERSION does not match $module version $MODULE_VERSION."
              echo "Bump 'version' in gradle.properties and date the CHANGELOG before tagging."
              exit 1
            fi
            echo "  $module $MODULE_VERSION"
          done
          echo "Releasing version $TAG_VERSION"

      # Checked before the build, not in the release job that consumes it: a Maven Central
      # publication cannot be undone, so a missing or misnamed CHANGELOG section has to fail while
      # failing is still free.
      - name: Verify the CHANGELOG has a section for this tag
        run: .github/scripts/changelog-section.sh "${GITHUB_REF_NAME#v}"

      - name: Build
        run: ./gradlew build --stacktrace

      # `publishToMavenCentral` uploads and *stages* the deployment; it does not make it public.
      # The Central Portal's Publish button is the last human checkpoint before something that can
      # never be deleted or overwritten, so it is deliberately not automated. To release without
      # that checkpoint once the pipeline is trusted, change this task to
      # `publishAndReleaseToMavenCentral` — and re-read the note on the github-release workflow,
      # which assumes publication is manual.
      - name: Publish to the Central Portal (staged, not yet public)
        run: ./gradlew publishToMavenCentral --no-configuration-cache --stacktrace
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}

      - name: What happens next
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          cat >> "$GITHUB_STEP_SUMMARY" <<SUMMARY
          ### $GITHUB_REF_NAME is staged, not published

          Nothing is public yet and nothing is permanent yet. To finish the release:

          1. Open <https://central.sonatype.com/publishing/deployments> and review the deployment.
          2. **Publish** it (or **Drop** it, at no cost, if something is wrong).
          3. Once it shows \`PUBLISHED\`, run the **Cut a GitHub Release** workflow with
             tag \`$GITHUB_REF_NAME\` to announce it.

          Step 3 is separate because a GitHub Release for a deployment you might still drop would
          announce a version nobody can resolve.
          SUMMARY
