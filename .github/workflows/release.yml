name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  publish:
    name: Publish to Maven Central
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          # Nothing here pushes to the repository, so the job's token has no business sitting in
          # .git/config where every later build and publish command inherits it.
          persist-credentials: false

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Verify tag matches module versions
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          case "$TAG_VERSION" in
            *-SNAPSHOT) echo "Refusing to release a -SNAPSHOT version ($TAG_VERSION)"; exit 1 ;;
          esac
          MODULES=$(./gradlew -q publishingModules)
          if [ -z "$MODULES" ]; then
            echo "Found no modules configured for publication - the version gate would pass"
            echo "without checking anything. Refusing to release."
            exit 1
          fi
          echo "Verifying $(echo "$MODULES" | wc -l) publishing module(s) against tag v$TAG_VERSION:"
          for module in $MODULES; do
            MODULE_VERSION=$(./gradlew -q "$module:properties" | awk '/^version: /{print $2}')
            if [ "$MODULE_VERSION" != "$TAG_VERSION" ]; then
              echo "Tag v$TAG_VERSION does not match $module version $MODULE_VERSION."
              echo "Bump 'version' in gradle.properties and date the CHANGELOG before tagging."
              exit 1
            fi
            echo "  $module $MODULE_VERSION"
          done
          echo "Releasing version $TAG_VERSION"

      # Checked before the build, not in the release job that consumes it: a Maven Central
      # publication cannot be undone, so a missing or misnamed CHANGELOG section has to fail while
      # failing is still free.
      - name: Verify the CHANGELOG has a section for this tag
        run: .github/scripts/changelog-section.sh "${GITHUB_REF_NAME#v}"

      - name: Build
        run: ./gradlew build --stacktrace

      - name: Publish
        run: ./gradlew publishAndReleaseToMavenCentral --no-configuration-cache --stacktrace
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}

  # A separate job, not a final step of `publish`, because the two have opposite failure
  # economics: publishing is irreversible, creating a release is a fallible API call. Sharing a job
  # would mean a transient GitHub outage forces "re-run failed jobs" to repeat the publish, which
  # immutable coordinates then reject — leaving the release uncreatable by re-run. Split, only this
  # job re-runs.
  release:
    name: Cut a GitHub Release
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The only write access in the workflow, held by the only job that needs it.
    permissions:
      contents: write
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # `gh` ships on the runner, so the release path takes on no third-party action.
      - name: Cut a GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          .github/scripts/changelog-section.sh "$TAG_VERSION" > "$RUNNER_TEMP/release-notes.md"
          # SemVer pre-release is the '-' component; build metadata after '+' may also contain a
          # hyphen (1.0.0+build-1), so strip that first. -SNAPSHOT is refused by the version gate.
          case "${TAG_VERSION%%+*}" in
            *-*) PRERELEASE=--prerelease ;;
            *)   PRERELEASE= ;;
          esac
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            --verify-tag \
            $PRERELEASE
