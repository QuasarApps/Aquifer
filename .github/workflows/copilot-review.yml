# Requests a Copilot code review on agent-authored PRs, as an account that
# actually holds a Copilot subscription. The logic lives in QuasarApps/.github
# so a fix lands once rather than in every repo; this file only supplies the
# trigger and the secret.
#
# Only the copy on this repository's DEFAULT branch does anything. GitHub
# resolves `pull_request_target` workflows from the default branch — not from
# the PR's base branch, and not from its head. Verified: a run fired on a PR
# whose base and head both lacked this file, with only the default branch
# carrying it. So one copy on `develop` covers every PR here whatever it
# targets, and copies on release branches are dead weight.
#
# `pull_request_target`, not `pull_request`: under `pull_request` the
# definition comes from the PR head, so anyone with push access could edit
# this file on a branch, open a PR, and exfiltrate COPILOT_REVIEW_PAT — a
# token belonging to an org owner. Default-branch resolution is what closes
# that path. It is only safe on top of the called workflow never checking out
# or executing PR code. Do not add steps here that do.
#
# Not triggered on `synchronize`: a review is metered against the requesting
# account (AI credits, plus Actions minutes for this job), so re-reviews after
# new pushes stay a judgement call. Close and reopen a PR to re-request.
name: Request Copilot review

on:
  pull_request_target:
    types: [opened, reopened, ready_for_review]

permissions:
  # Minimum needed to resolve the called workflow from another repository.
  # Not `{}`: zero permissions can leave the job unable to fetch it.
  contents: read

jobs:
  request:
    # Same-repo PRs only. `pull_request_target` also fires for fork PRs, and
    # while the called workflow's author gate would skip those, this stops the
    # secret entering that context in the first place. The author gate itself
    # stays centralised so a rename remains a one-place fix.
    if: github.event.pull_request.head.repo.full_name == github.repository
    uses: QuasarApps/.github/.github/workflows/copilot-review.yml@main
    # Named rather than `inherit`: inherit hands the called workflow every
    # secret this repo has, which is more than it needs and more than would
    # be obvious to whoever reads this file next.
    secrets:
      COPILOT_REVIEW_PAT: ${{ secrets.COPILOT_REVIEW_PAT }}
