# Requests a Copilot code review on agent-authored PRs, as an account that
# actually holds a Copilot subscription. The logic lives in QuasarApps/.github
# so a fix lands once rather than in every repo; this file only supplies the
# trigger and the secret.
#
# `pull_request_target`, not `pull_request`: the former runs the workflow
# definition from the BASE branch. Under `pull_request` the definition comes
# from the PR head, so anyone with push access could edit this file on a
# branch, open a PR, and exfiltrate COPILOT_REVIEW_PAT — a token belonging to
# an org owner. That trigger is only safe because the called workflow never
# checks out or executes PR code. Do not add steps here that do.
#
# Not triggered on `synchronize`: each Copilot review costs 13 premium
# requests, so re-reviews after new pushes stay a judgement call. Close and
# reopen a PR to re-request.
#
# Runs attach to the base commit, so they do not appear in the PR's own checks
# list — confirm via the Actions tab, not the PR.
name: Request Copilot review

on:
  pull_request_target:
    types: [opened, reopened, ready_for_review]

permissions: {}

jobs:
  request:
    uses: QuasarApps/.github/.github/workflows/copilot-review.yml@main
    # Named rather than `inherit`: inherit hands the called workflow every
    # secret this repo has, which is more than it needs and more than would
    # be obvious to whoever reads this file next.
    secrets:
      COPILOT_REVIEW_PAT: ${{ secrets.COPILOT_REVIEW_PAT }}
